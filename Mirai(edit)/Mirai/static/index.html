<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirai 🌸</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #1a1025, #0d0714);
    color: #f0e6ff; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 16px; text-align: center; font-weight: 700; font-size: 1.2rem;
    background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #7c3aed; color: white; border-bottom-right-radius: 4px; }
  .mirai { align-self: flex-start; background: rgba(255,255,255,0.08); border-bottom-left-radius: 4px; }
  .status { text-align: center; font-size: 0.75rem; opacity: 0.5; padding: 4px; }
  form {
    display: flex; gap: 8px; padding: 12px; background: rgba(255,255,255,0.03);
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  input[type=text] {
    flex: 1; padding: 12px 14px; border-radius: 999px; border: none;
    background: rgba(255,255,255,0.08); color: white; font-size: 1rem; outline: none;
  }
  button {
    padding: 0 20px; border-radius: 999px; border: none; background: #7c3aed;
    color: white; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>
<header>🌸 Mirai</header>
<div id="chat"></div>
<div class="status" id="status"></div>
<form id="form">
  <input type="text" id="input" placeholder="Fala com a Mirai..." autocomplete="off" />
  <button type="submit">Enviar</button>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const sessionId = 'web-' + Math.random().toString(36).slice(2, 10);

function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function playAudio(base64) {
  if (!base64) return;
  const audio = new Audio('data:audio/mpeg;base64,' + base64);
  try { await audio.play(); } catch (e) { console.warn('Autoplay bloqueado:', e); }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  input.value = '';
  input.disabled = true;
  statusEl.textContent = 'Mirai está pensando...';

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId, include_audio: true })
    });
    if (!res.ok) throw new Error('Erro ' + res.status);
    const data = await res.json();
    addMessage(data.response, 'mirai');
    playAudio(data.audio_base64);
  } catch (err) {
    addMessage('(erro ao falar com o servidor: ' + err.message + ')', 'mirai');
  } finally {
    statusEl.textContent = '';
    input.disabled = false;
    input.focus();
  }
});

// Verifica status do servidor ao abrir
fetch('/health').then(r => r.json()).then(d => {
  statusEl.textContent = d.gemini_configured
    ? '● conectado ao Gemini'
    : '● Gemini não configurado no servidor';
}).catch(() => { statusEl.textContent = '● não foi possível conectar'; });
</script>
</body>
</html>
